name: UNIsite
description: UNIsite, Inc. was a wireless communications infrastructure company founded
  in 1994 that owned and operated roughly 600 wireless towers and 46 managed antenna
  sites, focused on antenna siting, tower site management, ownership, and build-to-suit
  development. A Battery Ventures portfolio company, UNIsite was acquired by American
  Tower Corporation in a merger consummated in January 2000 (total consideration
  approximately $198.1 million, including assumed debt). The company no longer operates
  independently and publishes no APIs; the unisite.com domain is now held by an unrelated
  web-based business software product.
